[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aeronetra-sentinel"
version = "0.1.0"
description = "AeroNetra-Sentinel — single-frame monocular geo-registration for UAVs: recover object latitude/longitude from one image with a self-calibrating horizon."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pratyush Jain" }]
keywords = [
  "computer-vision", "georegistration", "geolocation", "uav", "drone",
  "monocular", "homography", "horizon", "geodesy", "remote-sensing",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Intended Audience :: Science/Research",
]
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7.4", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/Pratyush061/AeroNetra-Sentinel"
Source = "https://github.com/Pratyush061/AeroNetra-Sentinel"

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
