# AeroNetra-Sentinel — default configuration

scene:
  width: 640
  height: 480
  hfov: 70.0
  lat0: 18.5204          # drone ground position (Pune)
  lon0: 73.8567
  altitude: 120.0        # metres above ground
  heading: 0.0           # compass degrees
  depression: 25.0       # degrees below the horizon
  roll: 0.0
  num_objects: 8
  seed: 3

detect:
  blur_kernel: 31
  diff_threshold: 18
  min_area: 25
  morph_kernel: 3
  max_area_frac: 0.20

horizon:
  tau: 3.0
  min_columns: 30
  min_inliers: 20
  iterations: 200

attitude_source: estimated   # "estimated" (self-calibrating) or "true"
reference: center            # detection reference point: center | bottom
output_dir: outputs
save_heatmap: true
heatmap_extent: 220.0
heatmap_resolution: 32
